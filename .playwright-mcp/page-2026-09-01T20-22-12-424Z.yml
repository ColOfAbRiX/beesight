  - heading "How to interpret metrics" [level=1] [ref=e19]
  - img "metrics" [ref=e22]
  - generic [ref=e23]:
    - paragraph [ref=e24]:
      - generic [ref=e25]: "exited airplane:"
      - text: This is a very precise indication of exit altitude. If you exit while the plane is climbing (which is typical during a hop-n-pop) you will be "thrown" upward but the GPS can detect the precise exit point based on downward acceleration.
    - paragraph [ref=e26]:
      - generic [ref=e27]: "initiated turn:"
      - text: This indicates the initiation altitude of the speed building maneuver. This may mean different things depending on the pilot's flying style. It is typically the point where the pilot released his brakes and began applying double front riser input.
    - paragraph [ref=e28]:
      - generic [ref=e29]: "max vertical speed:"
      - text: This is the highest vertical speed during the turn (it usually occurs right before the rollout). It is a good indicator of how much power was built in the turn (wind has little effect on this metric).
    - paragraph [ref=e30]:
      - generic [ref=e31]: "started rollout:"
      - text: This is the altitude where the rollout begins. It is defined as the point where vertical speed peaks and then monotonically decreases until ground level. You may still be turning during the rollout but you are not generating vertical speed. Usually only minor heading corrections occur during the rollout.
    - paragraph [ref=e32]:
      - generic [ref=e33]: "max total speed:"
      - text: This is the highest total speed (combined speed on all axes) during the turn. Wind will influence this value.
    - paragraph [ref=e34]:
      - generic [ref=e35]: "max horizontal speed:"
      - text: This is the highest horizontal speed (combined speed in the x-axis and y-axis) during the turn and rollout. Wind will strongly influence this value (it will be higher during downwind swoops and lower during upwind swoops).
    - paragraph [ref=e36]:
      - generic [ref=e37]: "degrees of rotation:"
      - text: This indicates the size of the turn (the total heading change during the speed building maneuver).
    - paragraph [ref=e38]:
      - generic [ref=e39]: "time to execute turn:"
      - text: This is the elapsed time between the start of the turn and the beginning of the rollout.
    - paragraph [ref=e40]:
      - generic [ref=e41]: "time during rollout:"
      - text: This is the elapsed time between the start of the rollout and the point where the pilot passes the entry gate. If the entry gate is missed no value will be computed.
    - paragraph [ref=e42]:
      - generic [ref=e43]: "time aloft during swoop:"
      - text: This is the elapsed time between the entry gate and touchdown.
    - paragraph [ref=e44]:
      - generic [ref=e45]: "entry gate speed:"
      - text: This is the x-axis speed when the pilot eclipses the entry gate. It is interpolated between the nearest points before and after the gate.
    - paragraph [ref=e46]:
      - generic [ref=e47]: "distance to stop:"
      - text: This is the x-axis distance between the entry gate and the point where motion stops (it includes the slide or runout).
    - paragraph [ref=e48]:
      - generic [ref=e49]: "touchdown estimate:"
      - text: This is an estimate of the x-axis distance between the entry gate and the first point of contact with the ground. The pilot must walk back to the touchdown point before turning off the GPS in order to calculate this metric.
    - paragraph [ref=e50]:
      - generic [ref=e51]: "speed carve time:"
      - text: This is the time elapsed during a speed run through an IPC speed carve course. It is calculated only if the heuristics detect a speed carve run.