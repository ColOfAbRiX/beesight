global {
  preprocess-window-size = 20
  acceleration-clip      = 20.0
}

takeoff {
  smoothing-window-size      = 5
  backtrack-window-size      = 10
  validation-window-size     = 100
  validation-vertical-speed  = -2.466
  vertical-speed-threshold   = -2.0
  horizontal-speed-threshold = 30.0
  max-takeoff-altitude       = 600.0
}

freefall {
  vertical-speed-threshold  = 25.0
  validation-vertical-speed = 3.3565
  acceleration-threshold    = 3.0
  acceleration-min-velocity = 10.0
  min-freefall-altitude     = 600.0
  smoothing-window-size     = 5
  backtrack-window-size     = 10
  validation-window-size    = 100
}

canopy {
  smoothing-window-size     = 5
  backtrack-window-size     = 10
  validation-window-size    = 100
  vertical-speed-threshold  = 10.0
  min-canopy-altitude       = 600.0
  validation-vertical-speed = 1.3426
}

landing {
  smoothing-window-size      = 5
  backtrack-window-size      = 10
  validation-window-size     = 100
  vertical-speed-threshold   = 1.0
  horizontal-speed-threshold = 2.0
  stability-threshold        = 0.5
  validation-vertical-speed  = 0.05
}

swoop {
  gate-height                = 15.0
  min-swoop-vertical-speed   = 5.0
  min-horizontal-speed       = 2.0
  max-swoop-height           = 300.0
  recovery-fraction          = 0.5
  min-swoop-descent          = 30.0
  pull-threshold             = 11.176
  rollout-window             = 30.48
  sustained-recovery-samples = 3
  recovery-height            = 45.0
}
