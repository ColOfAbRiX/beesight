jumpevents {
  preprocess-window-size = 20
  acceleration-clip      = 20.0

  takeoff {
    smoothing-window-size      = 5
    backtrack-window-size      = 10
    validation-window-size     = 100
    validation-vertical-speed  = -2.466
    vertical-speed-threshold   = -2.0
    horizontal-speed-threshold = 30.0
    max-takeoff-altitude       = 600.0
  }

  freefall {
    vertical-speed-threshold  = 25.0
    validation-vertical-speed = 3.3565
    acceleration-threshold    = 3.0
    acceleration-min-velocity = 10.0
    min-freefall-altitude     = 600.0
    smoothing-window-size     = 5
    backtrack-window-size     = 10
    validation-window-size    = 100
  }

  canopy {
    smoothing-window-size     = 5
    backtrack-window-size     = 10
    validation-window-size    = 100
    vertical-speed-threshold  = 10.0
    min-canopy-altitude       = 600.0
    validation-vertical-speed = 1.3426
  }

  landing {
    smoothing-window-size      = 5
    backtrack-window-size      = 10
    validation-window-size     = 100
    vertical-speed-threshold   = 1.0
    horizontal-speed-threshold = 2.0
    stability-threshold        = 0.5
  }
}

swoop {
  altitudes {
    pattern-entry-altitude = 762.0
    dive-altitude-cap      = 304.8
    max-altitude-gain      = 152.4
    bottom-altitude-offset = 1.0
    rollout-window         = 30.48
  }

  speeds {
    pull-threshold            = 11.176
    steepening-entry          = 6.7056
    steepening-accumulator    = 6.7056
    stop-descent-threshold    = 4.4704
    stop-horizontal-threshold = 8.9408
    stop-end-horizontal       = 0.89408
    bottom-descent-threshold  = 4.4704
    bottom-vz-cross           = 1.25
  }

  angles {
    stop-heading-deviation = 45.0
    max-turn-rate          = 30.0
  }

  carve {
    rate-threshold       = 20.0
    exit-rate-threshold  = 5.0
    max-turn-degrees     = 110.0
    reliable-speed       = 10.0
    gap-samples          = 5
    direction-samples    = 10
    min-direction-change = 5.0
  }

  ground {
    window     = 10
    slow-speed = 4.4704
  }

  stream {
    before-canopy-margin = 10
  }
}

metrics {
  slope-half-window = 4
  mass              = 90.0
  planform-area     = 2.0
  # ground-elevation = 0.0   // Optional: ground level in m (MSL).  Absent = sea level.
}
